<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="redRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>
  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0f"/>
  <!-- Red ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#redRing)" stroke-width="3.5"/>
  <!-- Inner cream circle -->
  <circle cx="50" cy="50" r="28" fill="#e8dcc4"/>
  <!-- Pine tree trunk -->
  <rect x="48.5" y="58" width="3" height="9" fill="#3f2a1f"/>
  <!-- Pine tree foliage - three triangles stacked -->
  <polygon points="50,28 38,46 62,46" fill="#166534"/>
  <polygon points="50,40 36,56 64,56" fill="#1a7a3e"/>
  <polygon points="50,50 36,66 64,66" fill="#166534"/>
  <!-- Basketball -->
  <circle cx="50" cy="70" r="9" fill="#c8102e"/>
  <path d="M41 70 Q50 75 59 70" stroke="#111" stroke-width="0.8" fill="none"/>
  <path d="M50 61 Q45 70 50 79" stroke="#111" stroke-width="0.8" fill="none"/>
  <path d="M50 61 Q55 70 50 79" stroke="#111" stroke-width="0.8" fill="none"/>
  <!-- "PE" text in the ring -->
  <text x="50" y="20" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#c8102e" text-anchor="middle" letter-spacing="1.5">PINES</text>
  <text x="50" y="93" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#e8dcc4" text-anchor="middle" letter-spacing="1">ELITE</text>
</svg>