<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a1f"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Red glow behind logo -->
  <circle cx="600" cy="315" r="350" fill="url(#redGlow)"/>
  <!-- Left: Logo badge -->
  <g transform="translate(180, 145)">
    <!-- Outer dark circle -->
    <circle cx="170" cy="170" r="168" fill="#0a0a0f"/>
    <!-- Red ring -->
    <circle cx="170" cy="170" r="155" fill="none" stroke="#c8102e" stroke-width="10"/>
    <!-- Inner cream circle -->
    <circle cx="170" cy="170" r="100" fill="#e8dcc4"/>
    <!-- Pine tree -->
    <rect x="165" y="220" width="10" height="35" fill="#3f2a1f"/>
    <polygon points="170,80 130,160 210,160" fill="#166534"/>
    <polygon points="170,130 125,200 215,200" fill="#1a7a3e"/>
    <polygon points="170,170 125,240 215,240" fill="#166534"/>
    <!-- Basketball -->
    <circle cx="170" cy="270" r="32" fill="#c8102e"/>
    <path d="M138 270 Q170 285 202 270" stroke="#111" stroke-width="2.5" fill="none"/>
    <path d="M170 238 Q156 270 170 302" stroke="#111" stroke-width="2.5" fill="none"/>
    <path d="M170 238 Q184 270 170 302" stroke="#111" stroke-width="2.5" fill="none"/>
    <line x1="138" y1="270" x2="202" y2="270" stroke="#111" stroke-width="2.5"/>
    <!-- "PINES ELITE" curved text on top -->
    <text font-family="Impact, 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#c8102e" letter-spacing="6">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">PINES ELITE</textPath>
    </text>
    <!-- "AAU BASKETBALL" curved text on bottom -->
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e8dcc4" letter-spacing="3">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">AAU BASKETBALL</textPath>
    </text>
    <defs>
      <path id="topArc" d="M 30 170 A 140 140 0 0 1 310 170" fill="none"/>
      <path id="bottomArc" d="M 30 170 A 140 140 0 0 0 310 170" fill="none"/>
    </defs>
  </g>
  <!-- Right: Wordmark + tagline -->
  <g transform="translate(640, 200)">
    <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">PINES ELITE</text>
    <line x1="0" y1="30" x2="120" y2="30" stroke="#c8102e" stroke-width="4"/>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" letter-spacing="6">AAU BASKETBALL</text>
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#e2e8f0">Elite basketball. Character that lasts.</text>
    <text x="0" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">A 501(c)(3) nonprofit developing athletes in</text>
    <text x="0" y="228" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Southern Pines and Moore County, NC.</text>
  </g>
</svg>